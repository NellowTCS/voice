<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>voice 2</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col items-center p-6">
  <div class="max-w-2xl w-full bg-white rounded-lg shadow-md p-8">
    <h1 class="text-2xl font-semibold mb-6 border-b pb-4">FFT Voice Synthesizer</h1>
    
    <div class="mb-6">
      <div class="w-full h-32 bg-gray-50 border rounded overflow-hidden">
        <canvas id="visualizer" width="800" height="200" class="w-full h-full"></canvas>
      </div>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Text to Synthesize</label>
        <textarea id="textInput" class="w-full border rounded-md p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none h-24">hello world i am a standard web synthesizer</textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <div class="flex justify-between mb-1">
            <label class="text-sm font-medium text-gray-700">Pitch</label>
            <span id="pitchDisplay" class="text-sm text-gray-500">200 Hz</span>
          </div>
          <input type="range" id="pitchInput" min="100" max="400" value="200" class="w-full">
        </div>

        <div>
          <div class="flex justify-between mb-1">
            <label class="text-sm font-medium text-gray-700">Speed</label>
            <span id="speedDisplay" class="text-sm text-gray-500">1.0x</span>
          </div>
          <input type="range" id="speedInput" min="0.5" max="2.5" step="0.1" value="1" class="w-full">
        </div>
      </div>

      <button id="playBtn" class="w-full py-3 mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md transition-colors">
        Play
      </button>
    </div>
  </div>

  <script>
    const PHONEMES = {
      'a': { type: 'vowel', f1: 730, f2: 1090, f3: 2440, duration: 0.22 },
      'e': { type: 'vowel', f1: 530, f2: 1840, f3: 2480, duration: 0.22 },
      'i': { type: 'vowel', f1: 270, f2: 2290, f3: 3010, duration: 0.22 },
      'o': { type: 'vowel', f1: 400, f2: 800, f3: 2600, duration: 0.22 },
      'u': { type: 'vowel', f1: 300, f2: 870, f3: 2240, duration: 0.22 },
      'y': { type: 'vowel', f1: 300, f2: 2000, f3: 2800, duration: 0.08 },
      's': { type: 'fricative', freq: 5000, q: 2, duration: 0.18 },
      'f': { type: 'fricative', freq: 4000, q: 1, duration: 0.18 },
      'h': { type: 'fricative', freq: 2500, q: 1, duration: 0.12 },
      'z': { type: 'fricative', freq: 4500, q: 5, duration: 0.18 },
      't': { type: 'plosive', freq: 4000, duration: 0.08 },
      'p': { type: 'plosive', freq: 1000, duration: 0.08 },
      'k': { type: 'plosive', freq: 2500, duration: 0.08 },
      'd': { type: 'plosive', freq: 300, duration: 0.08 },
      'b': { type: 'plosive', freq: 200, duration: 0.08 },
      'g': { type: 'plosive', freq: 1500, duration: 0.08 },
      'm': { type: 'vowel', f1: 250, f2: 1200, f3: 2000, duration: 0.10 },
      'n': { type: 'vowel', f1: 250, f2: 1800, f3: 2000, duration: 0.10 },
      'l': { type: 'vowel', f1: 300, f2: 1200, f3: 2800, duration: 0.10 },
      'r': { type: 'vowel', f1: 400, f2: 1200, f3: 1500, duration: 0.08 },
      'w': { type: 'vowel', f1: 300, f2: 800, f3: 2200, duration: 0.08 },
      'v': { type: 'fricative', freq: 1500, q: 2, duration: 0.12 },
      'c': { type: 'plosive', freq: 2500, duration: 0.08 },
      'j': { type: 'fricative', freq: 3000, q: 2, duration: 0.15 },
      'q': { type: 'plosive', freq: 2500, duration: 0.08 },
      'x': { type: 'fricative', freq: 4500, q: 1.5, duration: 0.18 }
    };

    let audioCtx, analyser, compressor, animationFrame;
    let isPlaying = false;

    const textInput = document.getElementById('textInput');
    const pitchInput = document.getElementById('pitchInput');
    const pitchDisplay = document.getElementById('pitchDisplay');
    const speedInput = document.getElementById('speedInput');
    const speedDisplay = document.getElementById('speedDisplay');
    const playBtn = document.getElementById('playBtn');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    pitchInput.addEventListener('input', (e) => {
      pitchDisplay.textContent = e.target.value + ' Hz';
    });

    speedInput.addEventListener('input', (e) => {
      speedDisplay.textContent = parseFloat(e.target.value).toFixed(1) + 'x';
    });

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        
        // Add a compressor to prevent overlapping sounds from clipping (causing static)
        compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.value = -12;
        compressor.knee.value = 10;
        compressor.ratio.value = 12;
        compressor.attack.value = 0;
        compressor.release.value = 0.25;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        
        compressor.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        startVisualizer();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function createNoiseBuffer() {
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    function createVocalCordWave() {
      const numHarmonics = 40;
      const real = new Float32Array(numHarmonics);
      const imag = new Float32Array(numHarmonics);
      for (let i = 1; i < numHarmonics; i++) {
        real[i] = 0;
        imag[i] = (1.0 / (i * Math.PI)) * Math.pow(0.75, i);
      }
      return audioCtx.createPeriodicWave(real, imag);
    }

    function schedulePhoneme(char, time, speed, pitch) {
      const phoneme = PHONEMES[char] || PHONEMES['e'];
      const actualDuration = phoneme.duration / speed;
      
      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0, time);
      
      if (phoneme.type === 'plosive') {
        masterGain.gain.linearRampToValueAtTime(0.3, time + 0.01);
        masterGain.gain.exponentialRampToValueAtTime(0.001, time + actualDuration);
      } else if (phoneme.type === 'fricative') {
        const attack = Math.min(0.02, actualDuration * 0.2);
        const hold = Math.max(actualDuration - 0.03, actualDuration * 0.8);
        masterGain.gain.linearRampToValueAtTime(0.15, time + attack);
        masterGain.gain.setValueAtTime(0.15, time + hold);
        masterGain.gain.linearRampToValueAtTime(0.001, time + actualDuration);
      } else { // Vowels
        const attack = Math.min(0.02, actualDuration * 0.2);
        const hold = Math.max(actualDuration - 0.03, actualDuration * 0.8);
        masterGain.gain.linearRampToValueAtTime(0.6, time + attack);
        masterGain.gain.setValueAtTime(0.6, time + hold);
        masterGain.gain.linearRampToValueAtTime(0.001, time + actualDuration);
      }
      
      masterGain.connect(compressor);

      if (phoneme.type === 'vowel') {
        const source = audioCtx.createOscillator();
        source.setPeriodicWave(createVocalCordWave());
        
        source.frequency.setValueAtTime(pitch, time);
        source.frequency.exponentialRampToValueAtTime(pitch * 0.85, time + actualDuration);
        
        const vibrato = audioCtx.createOscillator();
        vibrato.frequency.value = 5.5;
        const vibratoGain = audioCtx.createGain();
        vibratoGain.gain.value = pitch * 0.02; // Slightly reduced vibrato depth
        vibrato.connect(vibratoGain);
        vibratoGain.connect(source.frequency);

        const breathSource = audioCtx.createBufferSource();
        breathSource.buffer = createNoiseBuffer();
        breathSource.loop = true;
        const breathFilter = audioCtx.createBiquadFilter();
        breathFilter.type = 'highpass';
        breathFilter.frequency.value = 4000;
        const breathGain = audioCtx.createGain();
        breathGain.gain.value = 0.04;
        breathSource.connect(breathFilter);
        breathFilter.connect(breathGain);
        breathGain.connect(masterGain);

        const formantShift = 1.15;
        const targetF1 = phoneme.f1 * formantShift;
        const targetF2 = phoneme.f2 * formantShift;
        const targetF3 = phoneme.f3 * formantShift;

        const f1 = audioCtx.createBiquadFilter(); f1.type = 'bandpass'; f1.Q.value = 8;
        f1.frequency.setValueAtTime(targetF1 * 0.8, time); // Start 20% lower
        f1.frequency.linearRampToValueAtTime(targetF1, time + actualDuration * 0.2); // Glide up
        f1.frequency.linearRampToValueAtTime(targetF1 * 0.9, time + actualDuration); // Drift down

        const f2 = audioCtx.createBiquadFilter(); f2.type = 'bandpass'; f2.Q.value = 10;
        f2.frequency.setValueAtTime(targetF2 * 0.8, time);
        f2.frequency.linearRampToValueAtTime(targetF2, time + actualDuration * 0.2);
        f2.frequency.linearRampToValueAtTime(targetF2 * 0.9, time + actualDuration);

        const f3 = audioCtx.createBiquadFilter(); f3.type = 'bandpass'; f3.Q.value = 12;
        f3.frequency.setValueAtTime(targetF3 * 0.9, time);
        f3.frequency.linearRampToValueAtTime(targetF3, time + actualDuration * 0.2);

        const g1 = audioCtx.createGain(); g1.gain.value = 1.0;
        const g2 = audioCtx.createGain(); g2.gain.value = 0.5;
        const g3 = audioCtx.createGain(); g3.gain.value = 0.1;

        source.connect(f1); f1.connect(g1); g1.connect(masterGain);
        source.connect(f2); f2.connect(g2); g2.connect(masterGain);
        source.connect(f3); f3.connect(g3); g3.connect(masterGain);

        source.start(time);
        source.stop(time + actualDuration + 0.05);
        vibrato.start(time);
        vibrato.stop(time + actualDuration + 0.05);
        breathSource.start(time);
        breathSource.stop(time + actualDuration + 0.05);

      } else if (phoneme.type === 'fricative' || phoneme.type === 'plosive') {
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = createNoiseBuffer();
        noiseSource.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass'; 
        
        if (phoneme.type === 'plosive') {
          filter.frequency.setValueAtTime(phoneme.freq, time);
          filter.frequency.exponentialRampToValueAtTime(phoneme.freq * 0.2, time + actualDuration);
        } else {
          filter.frequency.value = phoneme.freq;
        }
        
        filter.Q.value = phoneme.q || 1;

        noiseSource.connect(filter);
        filter.connect(masterGain);

        noiseSource.start(time);
        noiseSource.stop(time + actualDuration + 0.05);
      }

      return actualDuration;
    }

    function updatePlayState(playing) {
      isPlaying = playing;
      if (playing) {
        playBtn.textContent = 'Stop';
        playBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
        playBtn.classList.add('bg-red-600', 'hover:bg-red-700');
      } else {
        playBtn.textContent = 'Play';
        playBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
        playBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
      }
    }

    function speak() {
      const text = textInput.value;
      if (!text) return;
      initAudio();
      updatePlayState(true);

      const speed = parseFloat(speedInput.value);
      const basePitch = parseFloat(pitchInput.value);
      let time = audioCtx.currentTime + 0.1;
      const cleanedText = text.toLowerCase().replace(/[^a-z\s]/g, '');

      for (let i = 0; i < cleanedText.length; i++) {
        const char = cleanedText[i];
        if (char === ' ') {
          time += 0.2 / speed;
        } else {
          const progress = i / cleanedText.length;
          const currentPitch = basePitch * (1 - progress * 0.2);
          
          const duration = schedulePhoneme(char, time, speed, currentPitch);
          time += duration;
          time -= 0.02; // Reduced overlap time to prevent volume swelling
        }
      }

      setTimeout(() => {
        updatePlayState(false);
      }, (time - audioCtx.currentTime) * 1000);
    }

    function stop() {
      if (audioCtx) {
        audioCtx.close().then(() => {
          audioCtx = null;
          updatePlayState(false);
        });
      }
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        stop();
      } else {
        speak();
      }
    });

    function startVisualizer() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        if (!audioCtx) return;
        animationFrame = requestAnimationFrame(draw);

        analyser.getByteFrequencyData(dataArray);

        canvasCtx.fillStyle = '#f9fafb';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2.5;
        let barHeight;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          barHeight = dataArray[i] / 2;
          canvasCtx.fillStyle = '#3b82f6';
          canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        }
      }
      draw();
    }
  </script>
</body>
</html>
